server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve precompressed variants Vite emits (.br/.gz) when the client
    # advertises support — zero per-request CPU, ~75-80% smaller JS on the wire.
    brotli on;
    brotli_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    brotli_comp_level 6;
    brotli_static on;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;
    gzip_static on;

    # Hashed assets are immutable; index.html and the service worker are not.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Manifest must revalidate (install metadata changes ship with releases)
    # and must be served as application/manifest+json, which is not in the
    # stock mime.types map for the .webmanifest extension.
    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self'; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'none'" always;
}