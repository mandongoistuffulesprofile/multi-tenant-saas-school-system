# Compatibility entry point.
#
# The canonical development stack lives in
# infrastructure/docker/docker-compose.yml (PostgreSQL 18, Redis, migrate job,
# API). This file includes it so `docker compose up -d` from the repository
# root starts exactly the same services instead of the old PostgreSQL 16 /
# school_saas stack, which could not apply the PG18 baseline.
include:
  - infrastructure/docker/docker-compose.yml
