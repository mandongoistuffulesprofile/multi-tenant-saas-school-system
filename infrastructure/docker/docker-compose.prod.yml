# Production single-VPS stack: Postgres, Redis, migrations, API, SPA, Caddy.
# Copy .env.prod.example to .env.prod, fill secrets, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Only Caddy publishes ports. Postgres, Redis and the API stay on the private
# Docker network.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-skulapp_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-skulapp}
    volumes:
      # PostgreSQL 18 images create the cluster in a subdirectory of
      # /var/lib/postgresql; mounting .../data blocks startup. pg_upgrade a
      # pre-18 volume before switching (see docker-library/postgres#37).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skulapp_app} -d ${POSTGRES_DB:-skulapp}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    image: skulapp-api:${APP_VERSION:-latest}
    # backend/Dockerfile installs the migrator at /migrate (distroless has no
    # /app directory), so override the image entrypoint with that exact path.
    entrypoint: ["/migrate"]
    command: ["-dir", "/migrations"]
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skulapp_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skulapp}?sslmode=disable
    volumes:
      - ../../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  # One-shot first-admin bootstrap. Fresh databases have no users, so nobody
  # can sign in until this runs once:
  #   docker compose -f docker-compose.prod.yml --env-file .env.prod \
  #     run --rm bootstrap
  # Safe to re-run: it resets that account's password and leaves data intact.
  bootstrap:
    image: skulapp-api:${APP_VERSION:-latest}
    entrypoint: ["/bootstrap-admin"]
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-skulapp_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skulapp}?sslmode=disable
      BOOTSTRAP_EMAIL: ${BOOTSTRAP_EMAIL:-}
      BOOTSTRAP_PHONE: ${BOOTSTRAP_PHONE:-}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:-}
      BOOTSTRAP_ROLE: ${BOOTSTRAP_ROLE:-SAAS_ADMIN}
      BOOTSTRAP_TENANT: ${BOOTSTRAP_TENANT:-platform-ops}
      BOOTSTRAP_SCHOOL_NAME: ${BOOTSTRAP_SCHOOL_NAME:-Platform Operations}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]

  api:
    image: skulapp-api:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_VERSION: ${APP_VERSION:-latest}
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-skulapp_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-skulapp}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      CORS_ALLOWED_ORIGIN: https://${DOMAIN:?set DOMAIN}
      # Password-reset / invite links are built from this origin.
      APP_BASE_URL: https://${DOMAIN:?set DOMAIN}
      # Optional at go-live: without credentials the API logs M-Pesa callbacks
      # as unverified and never pushes STK requests, which is correct until a
      # school's own Daraja till is registered.
      MPESA_WEBHOOK_TOKEN: ${MPESA_WEBHOOK_TOKEN:-}
      MPESA_ALLOWED_IPS: ${MPESA_ALLOWED_IPS:-}
      # Optional outbound email (password reset, invites). Unset credentials =
      # messages are logged to the API stdout instead of sent.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Shule Yetu}
      # Optional SMS (Africa's Talking). Unset credentials = logged, not sent.
      AT_USERNAME: ${AT_USERNAME:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
      TIMEZONE: ${TIMEZONE:-Africa/Nairobi}
      CURRENCY: ${CURRENCY:-KES}
      METRICS_TOKEN: ${METRICS_TOKEN:?set METRICS_TOKEN}
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      # Distroless has no shell or wget. /healthcheck is a static Go probe
      # built into the API image by backend/Dockerfile.
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [internal]

  web:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    image: skulapp-web:${APP_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - web
    networks: [internal]

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
