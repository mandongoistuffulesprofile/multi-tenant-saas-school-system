version: '3.8'

services:
  postgres:
    # The canonical baseline (migrations/0001_baseline.sql) was dumped from
    # PostgreSQL 18 and uses named NOT NULL constraints, so pin the major.
    image: postgres:18-alpine
    container_name: school_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-school_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-school_system}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-school_admin} -d ${POSTGRES_DB:-school_system}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: school_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot migration job. It runs as a separate service so multiple API
  # replicas never race DDL; cmd/migrate also holds an advisory lock.
  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: school_migrate
    restart: "no"
    entrypoint: ["/app/migrate"]
    command: ["-dir", "/migrations"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-school_admin}:${POSTGRES_PASSWORD:-dev_secret_password}@postgres:5432/${POSTGRES_DB:-school_system}?sslmode=disable
    volumes:
      - ../../migrations:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: school_api
    restart: on-failure
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-school_admin}:${POSTGRES_PASSWORD:-dev_secret_password}@postgres:5432/${POSTGRES_DB:-school_system}?sslmode=disable
      REDIS_URL: redis://redis:6379
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-dev-signing-key-change-in-production-min-32-chars}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-dev-encryption-key-32-chars-long}
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
      PORT: 8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
