name: CI

on:
  push:
    branches: [main, stabilization]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skulapp_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: skulapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skulapp_app -d skulapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_ci?sslmode=disable
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Apply migrations to a fresh database
        working-directory: backend
        run: go run ./cmd/migrate -dir ../migrations

      - name: Tenant isolation, unit and integration tests
        working-directory: backend
        run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skulapp_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: skulapp_migrate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skulapp_app -d skulapp_migrate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_migrate_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Migrate twice (idempotency)
        working-directory: backend
        run: |
          go run ./cmd/migrate -dir ../migrations
          go run ./cmd/migrate -dir ../migrations
      - name: Baseline table count
        run: |
          count=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables: $count"
          test "$count" -ge 100

  prod-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate and health-check the production Compose stack
        working-directory: infrastructure/docker
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/skulapp-ci.env"
          cat > "$ENV_FILE" <<EOF
          DOMAIN=localhost
          APP_VERSION=ci
          POSTGRES_PASSWORD=ci_postgres_password
          JWT_SIGNING_KEY=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          MPESA_WEBHOOK_TOKEN=$(openssl rand -hex 32)
          METRICS_TOKEN=$(openssl rand -hex 32)
          EOF
          COMPOSE=(docker compose -p skulapp-ci -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file "$ENV_FILE")
          "${COMPOSE[@]}" down -v --remove-orphans || true
          "${COMPOSE[@]}" build --pull
          "${COMPOSE[@]}" up -d --wait postgres redis
          # Run twice: the production migrate service must be idempotent.
          "${COMPOSE[@]}" run --rm migrate
          "${COMPOSE[@]}" run --rm migrate
          "${COMPOSE[@]}" up -d --wait --no-deps --wait-timeout 120 api
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            "${COMPOSE[@]}" logs --no-color --tail=200 api
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/health/ready
      - name: Tear down the Compose stack
        if: always()
        working-directory: infrastructure/docker
        run: |
          ENV_FILE="$RUNNER_TEMP/skulapp-ci.env"
          if [ -f "$ENV_FILE" ]; then
            docker compose -p skulapp-ci -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file "$ENV_FILE" logs --no-color --tail=200 api || true
            docker compose -p skulapp-ci -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file "$ENV_FILE" down -v --remove-orphans || true
          fi
