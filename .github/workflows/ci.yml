name: CI

on:
  push:
    branches: [main, stabilization]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skulapp_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: skulapp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skulapp_app -d skulapp_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_ci?sslmode=disable
      TEST_DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_ci?sslmode=disable
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        working-directory: backend
        run: go build ./...

      - name: Vet
        working-directory: backend
        run: go vet ./...

      - name: Apply migrations to a fresh database
        working-directory: backend
        run: go run ./cmd/migrate -dir ../migrations

      - name: Create a non-superuser role for the isolation check
        run: |
          PGPASSWORD=test_password psql "postgres://skulapp_app@localhost:5432/skulapp_ci?sslmode=disable" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE skulapp_isolated LOGIN PASSWORD 'isolated_password'" \
            -c "GRANT USAGE ON SCHEMA public TO skulapp_isolated" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO skulapp_isolated" \
            -c "GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO skulapp_isolated"

      # The service container's bootstrap role is a superuser, and a superuser
      # bypasses RLS, so isolation asserts nothing through it. Run the check
      # through a role that is subject to the policies.
      - name: Tenant isolation on every RLS table
        working-directory: backend
        env:
          DATABASE_URL: postgres://skulapp_isolated:isolated_password@localhost:5432/skulapp_ci?sslmode=disable
        run: go run ./cmd/rlscheck

      - name: Tenant isolation, unit and integration tests
        working-directory: backend
        run: go test ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Pure Node, no dependencies: fails when a route is added to or removed
      # from App.tsx without the screenshot manifest following, which keeps
      # docs/ui-design/screenshots/coverable rather than silently partial.
      - name: Screenshot manifest matches App.tsx
        run: node scripts/ui-screenshots/check-routes.mjs
      # Pure Node: fails when a page calls an API path the server does not
      # register, which is how `/assessments/cbc/bulk-sync` reached main.
      - name: SPA calls match registered API routes
        run: node scripts/check-api-contract.mjs
      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit tests
        working-directory: frontend
        run: npm test

  # Proves the frontend and API agree over HTTP. Everything else here compiles
  # each half separately; this job seeds a tenant, serves the real build, and
  # fails on any non-2xx page or missing endpoint the harness sees.
  screenshot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skulapp_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: skulapp_smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skulapp_app -d skulapp_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_smoke?sslmode=disable
      REDIS_URL: redis://localhost:6379/0
      JWT_SIGNING_KEY: ci-screenshot-smoke-jwt-signing-key
      ENCRYPTION_KEY: ci-screenshot-smoke-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install puppeteer-core
        run: npm install --prefix "$RUNNER_TEMP/shots" puppeteer-core@24 --no-audit --no-fund
      - name: Seed a tenant, serve, and capture critical routes
        run: bash scripts/ci/screenshot-smoke.sh
      # Includes the server logs and the login probe response so a failed
      # capture can be diagnosed from the artifact alone, without rerunning.
      - name: Upload screenshots and run logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-smoke-run
          path: |
            ${{ runner.temp }}/screenshots
            ${{ runner.temp }}/sweep
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/preview.log
            ${{ runner.temp }}/login-summary.txt
          if-no-files-found: ignore

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skulapp_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: skulapp_migrate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skulapp_app -d skulapp_migrate_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_migrate_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Migrate twice (idempotency)
        working-directory: backend
        run: |
          go run ./cmd/migrate -dir ../migrations
          go run ./cmd/migrate -dir ../migrations
      - name: Baseline table count
        run: |
          count=$(psql "$DATABASE_URL" -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")
          echo "public tables: $count"
          test "$count" -ge 100

  # A backup that has never been restored is a guess. This applies migrations
  # and the demo seed, takes a real pg_dump, and restores it into a scratch
  # database, so the dump format, the schema and the RLS policies are proven
  # recoverable on every push rather than during an incident.
  restore-drill:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: skulapp_app
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: skulapp_drill
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U skulapp_app -d skulapp_drill"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_drill?sslmode=disable
      ADMIN_DATABASE_URL: postgres://skulapp_app:test_password@localhost:5432/skulapp_drill?sslmode=disable
      BACKUP_DIR: ${{ runner.temp }}/backups
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      # The runner's default client can be older than the postgres:18 service,
      # and pg_dump refuses to dump a newer server.
      - name: Install PostgreSQL 18 client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
      - name: Migrate and seed
        working-directory: backend
        run: go run ./cmd/migrate -dir ../migrations -seed
      - name: Take a backup
        run: |
          bash scripts/backup.sh
          dump="$(ls "$BACKUP_DIR"/*.dump | head -1)"
          echo "dump: $dump"
          sha256sum -c "$dump.sha256"
      - name: Restore it into a scratch database
        run: |
          dump="$(ls "$BACKUP_DIR"/*.dump | head -1)"
          bash scripts/verify_backup.sh "$dump"

  prod-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build, migrate and health-check the production Compose stack
        working-directory: infrastructure/docker
        run: |
          set -euo pipefail
          ENV_FILE="$RUNNER_TEMP/skulapp-ci.env"
          cat > "$ENV_FILE" <<EOF
          DOMAIN=localhost
          APP_VERSION=ci
          POSTGRES_PASSWORD=ci_postgres_password
          JWT_SIGNING_KEY=$(openssl rand -hex 32)
          ENCRYPTION_KEY=$(openssl rand -hex 32)
          MPESA_WEBHOOK_TOKEN=$(openssl rand -hex 32)
          METRICS_TOKEN=$(openssl rand -hex 32)
          BOOTSTRAP_EMAIL=owner@ci.test
          BOOTSTRAP_PASSWORD=CiBootstrapPassword123!
          BOOTSTRAP_PHONE=254700000001
          BOOTSTRAP_ROLE=SAAS_ADMIN
          BOOTSTRAP_TENANT=platform-ops
          EOF
          COMPOSE=(docker compose -p skulapp-ci -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file "$ENV_FILE")
          "${COMPOSE[@]}" down -v --remove-orphans || true
          "${COMPOSE[@]}" build --pull
          "${COMPOSE[@]}" up -d --wait postgres redis
          # Run twice: the production migrate service must be idempotent.
          "${COMPOSE[@]}" run --rm migrate
          "${COMPOSE[@]}" run --rm migrate
          "${COMPOSE[@]}" up -d --wait --no-deps --wait-timeout 120 api
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health/ready >/dev/null; then
              ok=1
              break
            fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            "${COMPOSE[@]}" logs --no-color --tail=200 api
            exit 1
          fi
          curl -fsS http://127.0.0.1:8080/health/ready

          # A fresh volume has no users, so the documented first step is the
          # bootstrap account. Signing in with it proves the whole stack wired
          # together: migrations, the membership self-access policy, JWT
          # signing and Redis-backed rate limiting.
          "${COMPOSE[@]}" --profile tools run --rm bootstrap
          login_status=$(curl -sS -o "$RUNNER_TEMP/login.json" -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"owner@ci.test","password":"CiBootstrapPassword123!"}')
          cat "$RUNNER_TEMP/login.json"
          echo
          if [ "$login_status" != "200" ]; then
            "${COMPOSE[@]}" logs --no-color --tail=200 api
            echo "bootstrap login returned HTTP $login_status" >&2
            exit 1
          fi
          grep -q '"tenant_id"' "$RUNNER_TEMP/login.json"
      - name: Tear down the Compose stack
        if: always()
        working-directory: infrastructure/docker
        run: |
          ENV_FILE="$RUNNER_TEMP/skulapp-ci.env"
          if [ -f "$ENV_FILE" ]; then
            docker compose -p skulapp-ci -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file "$ENV_FILE" logs --no-color --tail=200 api || true
            docker compose -p skulapp-ci -f docker-compose.prod.yml -f docker-compose.ci.yml --env-file "$ENV_FILE" down -v --remove-orphans || true
          fi
